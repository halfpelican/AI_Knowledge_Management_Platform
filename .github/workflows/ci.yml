# Stage 1 item 7: install on Python 3.12, run migrations against a Postgres
# service container, run pytest. The Python version comes from .python-version
# (decision D-01) so there is one source of truth.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Django on Python 3.12 + Postgres 16 (pgvector)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kmp
          POSTGRES_USER: kmp
          POSTGRES_PASSWORD: kmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kmp -d kmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      SECRET_KEY: ci-only-value-not-a-secret
      DEBUG: "False"
      DATABASE_URL: postgres://kmp:kmp@localhost:5432/kmp
      # The default provider since D-122. CI holds no API key: the startup check reports
      # a warning ("ANTHROPIC_API_KEY is not set"), never an error, and calls nothing; the
      # test suite uses the stub AIService fixture, so nothing here reaches a live model.
      AI_PROVIDER: anthropic
      EMBEDDING_DIMENSION: "1024"
      # The workspace is discarded after the job, so this only has to be writable, not durable
      MEDIA_ROOT: ${{ github.workspace }}/media

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run migrations from empty
        run: python manage.py migrate --noinput

      - name: Fail on model changes without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: Run the test suite
        run: pytest -q

  # Stage 5 item 4 (closes D-25's open question on front-end testing). Lint, build
  # and test the React application. No backend and no network: the suite stubs
  # fetch and XMLHttpRequest and fails any test that reaches either
  # (frontend/tests/setup.js), so this job needs no services.
  frontend:
    name: React on Node 24 — lint, build, test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      # jsdom's engines field requires Node ^22.22.2 or ^24.15.0; 24 matches the
      # development machine.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run the test suite
        run: npm test
