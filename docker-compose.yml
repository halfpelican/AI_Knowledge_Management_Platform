# Local PostgreSQL 16 + pgvector so all three developers run the same database
# (Stage 1 item 3). Development credentials only: they match DATABASE_URL in
# .env.example and are never used anywhere else.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kmp
      POSTGRES_USER: kmp
      POSTGRES_PASSWORD: kmp
    ports:
      # Loopback only: an unqualified "5432:5432" binds 0.0.0.0, and this same
      # container is the deployed alpha's data store (D-64 applied Waitress-side
      # only; item 11's early pass, 9 November 2026). The dev credentials above
      # must never be reachable from the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - kmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kmp -d kmp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  kmp_pgdata:
